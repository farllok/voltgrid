<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <title>VOLTGRID — tower defense</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0b0e14;
      }
      body {
        background:
          radial-gradient(1200px 700px at 20% 15%, rgba(79, 209, 255, 0.07), transparent 60%),
          radial-gradient(900px 600px at 85% 85%, rgba(179, 137, 255, 0.08), transparent 60%),
          #0b0e14;
      }
      #stage {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0;
      }
      canvas {
        display: block;
        width: min(100vw, 118.5185vh);
        height: auto;
        max-height: 100vh;
        aspect-ratio: 768 / 648;
        border-radius: 10px;
        box-shadow:
          0 0 0 1px rgba(79, 209, 255, 0.12),
          0 26px 80px rgba(0, 0, 0, 0.75),
          0 0 120px rgba(79, 209, 255, 0.06);
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
      }
    </style>
  </head>
  <body>
    <div id="stage">
      <canvas id="game" width="768" height="648" aria-label="VOLTGRID tower defense game field"></canvas>
    </div>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
